<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="مكتبة الوراق: فهرس مفتوح لعشرات الآلاف من الكتب المسقطة عنها حقوق النشر، مع أغلفتها وتصنيفاتها، وبحوث طبية وهندسية مجانية. Open index of public-domain books and free research.">
<meta property="og:title" content="مكتبة الوراق | Al-Warraq Library">
<meta property="og:type" content="website">
<title>مكتبة الوراق</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@500;700&family=Readex+Pro:wght@400;500;600;700&family=Source+Serif+4:wght@600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <div class="wrap bar-in">
    <a class="logo" href="#top" aria-label="Al-Warraq">
      <span class="logo-mark" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2"/><path d="M8 7h7M8 11h5"/></svg></span>
      <b data-i="brand">مكتبة الوراق</b>
    </a>
    <nav class="topnav" aria-label="Sections">
      <a href="#browse" data-i="nav_browse">الكتب</a>
      <a href="#authors" data-i="nav_authors">المؤلفون</a>
      <a href="#research" data-i="nav_research">البحوث</a>
    </nav>
    <form class="search" id="searchForm" role="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" autocomplete="off" data-iph="ph">
      <button type="submit" data-i="search"></button>
    </form>
    <div class="tools">
      <button class="ibtn" id="langBtn" type="button" aria-label="Language">EN</button>
      <button class="ibtn" id="themeBtn" type="button" data-iarl="theme" aria-label="Theme">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="top">
  <div class="wrap">
    <section class="hero">
      <div>
        <span class="tag" data-i="eyebrow"></span>
        <h1 data-i="h1"></h1>
        <p class="lead" data-i="lede"></p>
        <div class="quick" id="quick"></div>
        <div class="stats" id="stats"></div>
      </div>
      <div class="fan" id="fan" aria-hidden="true"></div>
    </section>
  </div>

  <section id="browse">
    <div class="wrap layout">
      <aside class="side" id="side" aria-label="Filters">
        <div class="grp">
          <h3 data-i="f_cat"></h3>
          <div class="catlist" id="catList"></div>
        </div>
        <div class="grp">
          <label class="sel"><span data-i="f_lang"></span><select id="fLang"></select></label>
          <label class="sel"><span data-i="f_org"></span><select id="fOrg"></select></label>
          <label class="sel"><span data-i="f_sort"></span><select id="fSort"></select></label>
          <button class="clear" id="clearBtn" type="button" data-i="clear"></button>
        </div>
      </aside>
      <div>
        <div class="res-head" aria-live="polite">
          <span class="count" id="count"></span>
          <span id="chips" style="display:contents"></span>
          <button id="filtBtn" type="button" aria-controls="side" aria-expanded="false"></button>
        </div>
        <div id="beyond"></div>
        <div class="grid" id="grid"></div>
        <div id="state"></div>
        <div id="sentinel"></div>
        <button class="more" id="moreBtn" type="button" hidden></button>
      </div>
    </div>
  </section>

  <section id="authors" class="authors-sec"><div class="wrap">
    <h2 data-i="authors_h"></h2>
    <p class="lead" data-i="authors_p"></p>
    <div class="avs" id="avs"></div>
    <button class="linkbtn" id="authMore" type="button" hidden></button>
  </div></section>

  <section id="research" class="research-sec"><div class="wrap">
    <h2 data-i="research_h"></h2>
    <p class="lead" data-i="research_p"></p>
    <div class="desks">
      <div class="desk" id="deskMed">
        <h3><i style="background:#E5484D"></i><span data-i="med_h"></span></h3>
        <p class="d" data-i="med_p"></p>
        <input id="rqMed" type="search" autocomplete="off" value="cardiology" aria-label="Medical topic">
        <div class="topics" id="topicsMed"></div>
        <div class="srcs" id="srcsMed"></div>
      </div>
      <div class="desk" id="deskEng">
        <h3><i style="background:#2B6BE9"></i><span data-i="eng_h"></span></h3>
        <p class="d" data-i="eng_p"></p>
        <input id="rqEng" type="search" autocomplete="off" value="control systems" aria-label="Engineering topic">
        <div class="topics" id="topicsEng"></div>
        <div class="srcs" id="srcsEng"></div>
      </div>
    </div>
  </div></section>
</main>

<footer><div class="wrap">
  <p data-i="legal1"></p>
  <p data-i="legal2"></p>
</div></footer>

<script src="app.js"></script>
</body>
</html>
