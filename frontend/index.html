<!doctype html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="description" content="مكتبة الوراق: فهرس مفتوح لأكثر من مليون كتاب مسقطة عنها حقوق النشر، وعشرات آلاف القصائد العربية، مع أغلفتها وتصنيفاتها، وبحوث طبية وهندسية مجانية. Open index of public-domain books and free research.">
    <meta name="theme-color" content="#F5F9FF">
    <meta name="robots" content="index,follow">
    <meta property="og:title" content="مكتبة الوراق | Al-Warraq Library">
    <meta property="og:description" content="أكثر من مليون كتاب مجاني ومسقط عنه حق النشر، وديوان العرب من ويكي مصدر. Free public-domain books and Arabic poetry.">
    <meta property="og:site_name" content="Al-Warraq Library">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "WebSite",
            "name": "مكتبة الوراق | Al-Warraq Library",
            "inLanguage": ["ar", "en"],
            "description": "Free public-domain books library in Arabic and English."
        }
    </script>
    <title>مكتبة الوراق | كتب مجانية Free Books</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@500;700&family=Readex+Pro:wght@400;500;600;700&family=Reem+Kufi:wght@600;700&family=Source+Serif+4:wght@600;700&display=swap">
    <link rel="stylesheet" href="style.css?v=6">
</head>

<body>
    <!-- shared gradient for the logo mark -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
            <linearGradient id="gLogo" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#5BC0FF" />
                <stop offset=".55" stop-color="#1A6FDF" />
                <stop offset="1" stop-color="#FF6B9A" />
            </linearGradient>
        </defs>
    </svg>

    <header class="bar">
        <div class="wrap bar-in">
            <a class="logo" href="#top" aria-label="Al-Warraq">
                <span class="logo-mark" aria-hidden="true">
                    <svg viewBox="0 0 48 48" width="42" height="42">
                        <rect class="lg-bg" x="1" y="1" width="46" height="46" rx="15" fill="url(#gLogo)" />
                        <path class="lg-pl" d="M24 35c-4.6-3-9.4-3.6-14-2.2V16.6c4.6-1.4 9.4-.8 14 2.4z" fill="#fff" />
                        <path class="lg-pr" d="M24 35c4.6-3 9.4-3.6 14-2.2V16.6c-4.6-1.4-9.4-.8-14 2.4z" fill="#fff" fill-opacity=".82" />
                        <path class="lg-ln" d="M13.5 21.5c2.6-.5 5.2-.2 7.6.9M13.5 25.5c2.6-.5 5.2-.2 7.6.9" stroke="#1A6FDF" stroke-opacity=".35" stroke-width="1.4" stroke-linecap="round" fill="none" />
                        <path class="lg-q" d="M36.5 6.5c-6.2 1.4-10.6 6.4-11.6 13.6 2.6-4.8 6.4-9 11.6-13.6z" fill="#fff" />
                        <path class="lg-q2" d="M36.5 6.5 26 18" stroke="#FF6B9A" stroke-width="1.1" stroke-linecap="round" />
                        <path class="lg-st" d="M12.5 7.5l1.1 2.6 2.6 1.1-2.6 1.1-1.1 2.6-1.1-2.6-2.6-1.1 2.6-1.1z" fill="#fff" />
                    </svg>
                </span>
                <span class="logo-txt"><b data-i="brand">مكتبة الوراق</b><small data-i="brand_sub"></small></span>
            </a>
            <nav class="topnav" aria-label="Sections">
                <a href="#browse"><svg class="ic ic-nb" viewBox="0 0 24 24" aria-hidden="true"><path pathLength="1" d="M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z M8 7h7 M8 11h5"/></svg><span data-i="nav_browse">الكتب</span></a>
                <a href="#poetry"><svg class="ic ic-poe" viewBox="0 0 24 24" aria-hidden="true"><path pathLength="1" d="M20.2 3.8C13 4 8 9 8 15v2h2c6 0 10.5-5 10.2-13.2z M4 21l6-6"/></svg><span data-i="nav_poetry">الشعر</span></a>
                <a href="#authors"><svg class="ic ic-bio" viewBox="0 0 24 24" aria-hidden="true"><path pathLength="1" d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M4 21a8 8 0 0 1 16 0"/></svg><span data-i="nav_authors">المؤلفون</span></a>
                <a href="#research"><svg class="ic ic-sci" viewBox="0 0 24 24" aria-hidden="true"><path pathLength="1" d="M9 3h6 M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3 M8 15h8"/></svg><span data-i="nav_research">البحوث</span></a>
            </nav>
            <form class="search" id="searchForm" role="search">
                <svg class="ic ic-search" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                <input id="q" type="search" autocomplete="off" data-iph="ph">
                <button type="submit" data-i="search"></button>
            </form>
            <div class="tools">
                <button class="ibtn lang-btn" id="langBtn" type="button" aria-label="Language">EN</button>
                <button class="ibtn theme-btn" id="themeBtn" type="button" data-iarl="theme" aria-label="Theme">
                    <svg class="ic i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                    <svg class="ic i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/><path class="tw" d="M17 3v3M15.5 4.5h3"/></svg>
                </button>
            </div>
        </div>
    </header>

    <main id="top">
        <section class="hero-sec">
            <div class="blobs" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>
            <div class="wrap hero">
                <div class="hero-txt">
                    <span class="tag"><svg class="ic ic-spark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.4z M19 16l.8 2.2 2.2.8-2.2.8L19 22l-.8-2.2-2.2-.8 2.2-.8z"/></svg><span data-i="eyebrow"></span></span>
                    <h1 data-i="h1"></h1>
                    <p class="lead" data-i="lede"></p>
                    <div class="quick" id="quick"></div>
                    <div class="stats" id="stats"></div>
                </div>
                <div class="fan" id="fan" aria-hidden="true"></div>
            </div>
        </section>

        <section class="cats-sec reveal" id="cats">
            <div class="wrap">
                <div class="sec-head">
                    <span class="sec-ic" aria-hidden="true"><svg class="ic ic-gen" viewBox="0 0 24 24"><path pathLength="1" d="M4 4h6v6H4z M14 4h6v6h-6z M4 14h6v6H4z M14 14h6v6h-6z"/></svg></span>
                    <div>
                        <h2 data-i="cats_h"></h2>
                        <p class="lead" data-i="cats_p"></p>
                    </div>
                </div>
                <div class="catgrid" id="catGrid"></div>
            </div>
        </section>

        <section class="poetry-sec reveal" id="poetry" hidden>
            <div class="wrap">
                <div class="poetry">
                    <div class="poetry-txt">
                        <span class="tag rose"><svg class="ic ic-poe" viewBox="0 0 24 24" aria-hidden="true"><path pathLength="1" d="M20.2 3.8C13 4 8 9 8 15v2h2c6 0 10.5-5 10.2-13.2z M4 21l6-6"/></svg><span data-i="poems_tag"></span></span>
                        <h2 data-i="poems_h"></h2>
                        <p class="lead" id="poemsLead"></p>
                        <blockquote class="verse" id="verse"></blockquote>
                    </div>
                    <div class="poets" id="poets"></div>
                </div>
            </div>
        </section>

        <section class="pop-sec" id="popular" hidden>
            <div class="wrap">
                <div id="popBooks"></div>
                <div id="popSearch"></div>
            </div>
        </section>

        <section id="browse" class="browse-sec">
            <div class="wrap">
                <div class="sec-head">
                    <span class="sec-ic" aria-hidden="true"><svg class="ic ic-nov" viewBox="0 0 24 24"><path pathLength="1" d="M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z M8 7h7 M8 11h5"/></svg></span>
                    <div>
                        <h2 data-i="browse_h"></h2>
                        <p class="lead" data-i="browse_p"></p>
                    </div>
                </div>
            </div>
            <div class="wrap layout">
                <aside class="side" id="side" aria-label="Filters">
                    <div class="grp">
                        <h3 data-i="f_cat"></h3>
                        <div class="catlist" id="catList"></div>
                    </div>
                    <div class="grp">
                        <label class="sel"><span data-i="f_lang"></span><select id="fLang"></select></label>
                        <label class="sel"><span data-i="f_org"></span><select id="fOrg"></select></label>
                        <label class="sel"><span data-i="f_sort"></span><select id="fSort"></select></label>
                        <button class="clear" id="clearBtn" type="button" data-i="clear"></button>
                    </div>
                </aside>
                <div>
                    <div class="res-head" aria-live="polite">
                        <span class="count" id="count"></span>
                        <span id="chips" style="display:contents"></span>
                        <button id="filtBtn" type="button" aria-controls="side" aria-expanded="false"></button>
                    </div>
                    <div id="beyond"></div>
                    <div class="grid" id="grid"></div>
                    <div id="state"></div>
                    <div id="sentinel"></div>
                    <button class="more" id="moreBtn" type="button" hidden></button>
                </div>
            </div>
        </section>

        <section id="authors" class="authors-sec reveal">
            <div class="wrap">
                <div class="sec-head">
                    <span class="sec-ic" aria-hidden="true"><svg class="ic ic-bio" viewBox="0 0 24 24"><path pathLength="1" d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M4 21a8 8 0 0 1 16 0"/></svg></span>
                    <div>
                        <h2 data-i="authors_h"></h2>
                        <p class="lead" data-i="authors_p"></p>
                    </div>
                </div>
                <div class="avs" id="avs"></div>
                <button class="linkbtn" id="authMore" type="button" hidden></button>
            </div>
        </section>

        <section id="research" class="research-sec reveal">
            <div class="wrap">
                <div class="sec-head">
                    <span class="sec-ic" aria-hidden="true"><svg class="ic ic-sci" viewBox="0 0 24 24"><path pathLength="1" d="M9 3h6 M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3 M8 15h8"/></svg></span>
                    <div>
                        <h2 data-i="research_h"></h2>
                        <p class="lead" data-i="research_p"></p>
                    </div>
                </div>
                <div class="desks">
                    <div class="desk" id="deskMed">
                        <h3><span class="dk-ic med" aria-hidden="true"><svg class="ic ic-med" viewBox="0 0 24 24"><path pathLength="1" d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z M12 8v8 M8 12h8"/></svg></span><span data-i="med_h"></span></h3>
                        <p class="d" data-i="med_p"></p>
                        <input id="rqMed" type="search" autocomplete="off" value="cardiology" data-iph="r_ph">
                        <div class="topics" id="topicsMed"></div>
                        <div class="papers" id="papersMed" aria-live="polite"></div>
                        <h4 class="src-h" data-i="also_src"></h4>
                        <div class="srcs" id="srcsMed"></div>
                    </div>
                    <div class="desk" id="deskEng">
                        <h3><span class="dk-ic eng" aria-hidden="true"><svg class="ic ic-eng" viewBox="0 0 24 24"><path pathLength="1" d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M12 2v3 M12 19v3 M2 12h3 M19 12h3 M5 5l2 2 M17 17l2 2 M19 5l-2 2 M7 17l-2 2"/></svg></span><span data-i="eng_h"></span></h3>
                        <p class="d" data-i="eng_p"></p>
                        <input id="rqEng" type="search" autocomplete="off" value="control systems" data-iph="r_ph">
                        <div class="topics" id="topicsEng"></div>
                        <div class="papers" id="papersEng" aria-live="polite"></div>
                        <h4 class="src-h" data-i="also_src"></h4>
                        <div class="srcs" id="srcsEng"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="foot">
        <div class="wrap foot-in">
            <div class="foot-brand">
                <a class="logo" href="#top" aria-label="Al-Warraq">
                    <span class="logo-mark sm" aria-hidden="true"><svg viewBox="0 0 48 48" width="34" height="34"><rect x="1" y="1" width="46" height="46" rx="15" fill="url(#gLogo)"/><path d="M24 35c-4.6-3-9.4-3.6-14-2.2V16.6c4.6-1.4 9.4-.8 14 2.4z" fill="#fff"/><path d="M24 35c4.6-3 9.4-3.6 14-2.2V16.6c-4.6-1.4-9.4-.8-14 2.4z" fill="#fff" fill-opacity=".82"/><path d="M36.5 6.5c-6.2 1.4-10.6 6.4-11.6 13.6 2.6-4.8 6.4-9 11.6-13.6z" fill="#fff"/></svg></span>
                    <span class="logo-txt"><b data-i="brand">مكتبة الوراق</b></span>
                </a>
                <p data-i="foot_about"></p>
            </div>
            <div class="foot-src">
                <h3 data-i="foot_src"></h3>
                <a href="https://www.gutenberg.org" target="_blank" rel="noopener">Project Gutenberg</a>
                <a href="https://www.hathitrust.org" target="_blank" rel="noopener">HathiTrust</a>
                <a href="https://ar.wikisource.org" target="_blank" rel="noopener" data-i="ws_name"></a>
                <a href="https://openlibrary.org" target="_blank" rel="noopener">Open Library</a>
            </div>
            <div class="foot-legal">
                <p data-i="legal1"></p>
                <p data-i="legal2"></p>
            </div>
        </div>
        <div class="wrap">
            <div class="visits" id="visits" aria-live="polite" hidden></div>
        </div>
    </footer>

    <script src="app.js?v=8"></script>
</body>

</html>
